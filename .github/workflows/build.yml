name: Build and Release Module

# 触发条件：当推送形如 v1.0, v1.0.1 的 Tag 时，或者手动点击运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # 强制使用 Node.js 24，消除底层的官方弃用警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # 必须赋予写权限，否则 Action 无法在你的仓库里创建 Release
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号与设置标签
        id: get_info
        run: |
          # 从 module.prop 中提取版本号 (此时提取出来的值已经是 v1.0.1)
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # 判断是推送 Tag 触发还是手动触发，动态生成包名
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            # 手动触发时，直接使用提取出的 VERSION 加时间戳，去掉了多余的 'v'
            echo "RELEASE_TAG=${VERSION}-$(date +'%Y%m%d')" >> $GITHUB_ENV
          fi

      - name: 打包为 ZIP 模块
        run: |
          mkdir -p output
          # 排除隐藏文件夹和 Markdown 说明文档，保持包体纯净
          zip -r9 output/FCM-Fixer-${{ env.RELEASE_TAG }}.zip . -x "*.git*" -x ".github/*" -x "output/*" -x "*.md"

      - name: 自动创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Release 的标题也会同步修复
          name: FCM-Fixer Release ${{ env.RELEASE_TAG }}
          body: |
            ### 🚀 FCM-Fixer 更新
            - 自动打包生成的模块文件。
            - 请下载下方的 `.zip` 文件并通过 Magisk / KernelSU / APatch 刷入。
          files: output/FCM-Fixer-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
